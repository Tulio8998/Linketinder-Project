plugins {
    id 'groovy'
    id 'jacoco'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:5.0.8'
//    testImplementation platform('org.junit:junit-bom:5.10.0')
//    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation platform('org.spockframework:spock-bom:2.4-groovy-5.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'net.bytebuddy:byte-buddy:1.15.11'

    implementation 'org.apache.groovy:groovy-sql:4.0.15'
//    implementation 'com.h2database:h2:2.2.224'
    implementation 'org.postgresql:postgresql:42.5.1'


    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.28'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
}

tasks.register('runApi', JavaExec) {
    group = 'application'
    description = 'Inicia a API REST - porta: 8080'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.zg.linketinder.api.ApiServer'
}

application {
    mainClass = 'com.zg.linketinder.Main'
}

test {
    useJUnitPlatform()
}

run {
    standardInput = System.in
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
    }
}